server {
    listen 100;
    server_name localhost;

    client_max_body_size 50M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # "backend" = docker-compose service name (see docker-compose.yml).
        # NOTE: no trailing "/" after the port here — that would make nginx
        # strip the "/api" prefix before forwarding, but the backend's
        # FastAPI routes are defined WITH the "/api" prefix (e.g.
        # /api/v1/reports/{id}/status). Passing no path here means nginx
        # forwards the original request URI unchanged.
        proxy_pass http://backend:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Video upload/analysis can take a few minutes for large files —
        # nginx's 60s default timeout was killing the request before the
        # backend even finished processing. Match this to gunicorn's
        # --timeout 600 in backend/Dockerfile.
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /ws/ {
        proxy_pass http://backend:8000; 
        
        # Ye 3 lines WebSocket connection ko zinda rakhti hain
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # FastAPI's built-in Swagger UI / OpenAPI schema live at the backend's
    # root (not under /api), so they need their own proxy locations to be
    # reachable without exposing port 8000 to the internet.
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
